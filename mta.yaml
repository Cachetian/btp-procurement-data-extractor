## Generated mta.yaml based on template version 0.2.0
## appName = dataextraction
## language=nodejs; multiTenant=false
## approuter=
_schema-version: '3.1'
ID: kit-data-lake-btp-extractor
version: 1.0.11
description: "SAP Ariba Extraction Data Lake"
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build

modules:

 # --------------------- SERVER MODULE ------------------------
 - name: kit-data-lake-btp-extractor-srv
 # ------------------------------------------------------------
   type: nodejs
   path: gen/srv
   build-parameters:
     ignore: ["node_modules/"]
   parameters:
     buildpack: nodejs_buildpack
     app-name: kit-data-lake-btp-extractor-srv
     disk-quota: 1GB
     memory: 1GB
   requires:
    # Resources extracted from CAP configuration
    - name: kit-data-lake-hana
    - name: kit-data-lake-btp-uaa
    - name: kit-data-lake-dest
    - name: kit-data-lake-conn
    - name: kit-data-lake-log
    - name: kit-data-lake-jobscheduler
   provides:
    - name: srv-api      # required by consumers of CAP services (e.g. approuter)
      public: true
      properties:
        url: ${default-url}

 - name: kit-data-lake-extractor-btp-db-deployer
   type: hdb
   path: gen/db
   build-parameters:
    ignore: ["node_modules/"]
   parameters:
    buildpack: nodejs_buildpack
    deploy-format: incremental
   requires:
    - name: kit-data-lake-hana
      parameters:
       disk-quota: 256M
       memory: 256M
      properties:
       TARGET_CONTAINER: ~{hdi-service-name}
    - name: cross-container-service-1
      group: SERVICE_REPLACEMENTS
      properties:
       key: ServiceName_1
       service: ~{userprovided-service-name}

resources:
# ------------------------------------------------------------
 - name: kit-data-lake-hana
# ------------------------------------------------------------
   type: com.sap.xs.hdi-container
   parameters:
    config:
     
     schema: SAP_ARIBA_FOUNDATION
    service: hana
    service-plan: hdi-shared
   properties:
    hdi-service-name: ${service-name}

 - name: cross-container-service-1
   type: org.cloudfoundry.existing-service
   parameters:
     service-name: DS_INTEGRATION
   properties:
     userprovided-service-name: ${service-name}

 # ------------------------------------------------------------
 - name: kit-data-lake-jobscheduler
 # ------------------------------------------------------------
   type: org.cloudfoundry.managed-service
   parameters:
     service-plan: standard
     service: jobscheduler
     config:
       enable-xsuaa-support: true

# ------------------------------------------------------------
 - name: kit-data-lake-btp-uaa
# ------------------------------------------------------------
   type: org.cloudfoundry.managed-service
   parameters:
     service: xsuaa
     service-plan: application
     path: ./xs-security.json
     config:
       xsappname: kit-data-lake-btp-extractor
       tenant-mode: dedicated

# ------------------------------------------------------------
 - name: kit-data-lake-dest
# ------------------------------------------------------------
   type: org.cloudfoundry.managed-service
   parameters:
     service-plan: lite
     service: destination

# ------------------------------------------------------------
 - name: kit-data-lake-conn
# ------------------------------------------------------------
   type: org.cloudfoundry.managed-service
   parameters:
     service-plan: lite
     service: connectivity

# ------------------------------------------------------------
 - name: kit-data-lake-log
# ------------------------------------------------------------
   type: org.cloudfoundry.managed-service
   parameters:
     service-plan: lite
     service: application-logs
